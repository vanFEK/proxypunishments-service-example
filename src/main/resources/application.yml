spring:
  application:
    name: proxypunishments-service
  liquibase:
    change-log: classpath:db/changelog/master.xml
    default-schema: proxypunishments
    liquibase-schema: proxypunishments
  r2dbc:
    properties:
      schema: proxypunishments
    pool:
      initial-size: 4
      max-size: 32
      max-idle-time: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

proxypunishments:
  mode: ${PROXYPUNISHMENTS_MODE:local}
  security:
    # No default on purpose: an unset token must stop the service from starting rather than
    # silently disable authentication.
    service-token: ${PROXYPUNISHMENTS_SERVICE_TOKEN}
  cache:
    active-punishment-ttl: PT30S
    lookup-ttl: PT10M
    max-size: 100000
  redis:
    # Off by default: without it a punishment reaches the other proxies within cache.active-ttl,
    # with it within a round trip. Nothing else changes either way.
    enabled: ${PROXYPUNISHMENTS_REDIS_ENABLED:false}
    host: ${PROXYPUNISHMENTS_REDIS_HOST:localhost}
    port: ${PROXYPUNISHMENTS_REDIS_PORT:6379}
    username: ${PROXYPUNISHMENTS_REDIS_USERNAME:}
    password: ${PROXYPUNISHMENTS_REDIS_PASSWORD:}
    database: ${PROXYPUNISHMENTS_REDIS_DATABASE:0}
    channel: ${PROXYPUNISHMENTS_REDIS_CHANNEL:proxypunishments.invalidations}
    connect-timeout: PT2S
  discord:
    enabled: ${PROXYPUNISHMENTS_DISCORD_ENABLED:false}
    webhook-url: ${PROXYPUNISHMENTS_DISCORD_WEBHOOK_URL:}
    announce-issued: ${PROXYPUNISHMENTS_DISCORD_ANNOUNCE_ISSUED:true}
    announce-lifted: ${PROXYPUNISHMENTS_DISCORD_ANNOUNCE_LIFTED:true}
    timeout: PT3S
  remote:
    base-url: ${PROXYPUNISHMENTS_REMOTE_BASE_URL:}
    api-token: ${PROXYPUNISHMENTS_REMOTE_API_TOKEN:}
    token-header: ${PROXYPUNISHMENTS_REMOTE_TOKEN_HEADER:X-Server-Key}
    connect-timeout: PT2S
    read-timeout: PT3S
    # Endpoint layout of the backend being fronted. {0} is the player UUID or name.
    paths:
      active-ban: ${PROXYPUNISHMENTS_REMOTE_PATH_ACTIVE_BAN:/internal/game-bans/{0}}
      issue-ban: ${PROXYPUNISHMENTS_REMOTE_PATH_ISSUE_BAN:/internal/game-bans}
      lift-ban: ${PROXYPUNISHMENTS_REMOTE_PATH_LIFT_BAN:/internal/game-bans/{0}/delete}
      list-bans: ${PROXYPUNISHMENTS_REMOTE_PATH_LIST_BANS:/internal/v1/bans}
      # Blank by default: a backend that knows nothing about mutes leaves these unset and mute
      # reads and writes degrade to empty instead of failing.
      active-mute: ${PROXYPUNISHMENTS_REMOTE_PATH_ACTIVE_MUTE:}
      issue-mute: ${PROXYPUNISHMENTS_REMOTE_PATH_ISSUE_MUTE:}
      lift-mute: ${PROXYPUNISHMENTS_REMOTE_PATH_LIFT_MUTE:}
      list-mutes: ${PROXYPUNISHMENTS_REMOTE_PATH_LIST_MUTES:}
      # Blank for the same reason: a backend without IP bans leaves these unset and IP-ban reads and
      # writes degrade to empty instead of failing.
      active-ip-ban: ${PROXYPUNISHMENTS_REMOTE_PATH_ACTIVE_IP_BAN:}
      issue-ip-ban: ${PROXYPUNISHMENTS_REMOTE_PATH_ISSUE_IP_BAN:}
      lift-ip-ban: ${PROXYPUNISHMENTS_REMOTE_PATH_LIFT_IP_BAN:}
      list-ip-bans: ${PROXYPUNISHMENTS_REMOTE_PATH_LIST_IP_BANS:}
      history: ${PROXYPUNISHMENTS_REMOTE_PATH_HISTORY:/internal/v1/punish-logs/{0}}
      lookup: ${PROXYPUNISHMENTS_REMOTE_PATH_LOOKUP:/internal/servers/user/{0}}
