name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Docker is available on ubuntu-latest, so the Testcontainers integration tests
      # really run here even though they skip on machines without it.
      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: proxypunishments-service
          path: build/libs/proxypunishments-service-*.jar
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f docker/Dockerfile -t proxypunishments-service:ci .
